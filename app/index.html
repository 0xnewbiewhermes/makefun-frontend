<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live bounties · make.fun</title>
<script type="module">/* 1 read paints the board, then import() app.js */
const boardCards = new Map();

function paintBoardFirstFrame(container, bounties) {
  container.innerHTML = '<div class=hero><h1 tabindex=-1>Live bounties</h1><p class=totals></p><p class=live>● Live</p></div><ul class=grid></ul>';
  const [hero, list] = container.children;
  const frame = { totals: hero.children[1], live: hero.children[2], list };
  writeBoardTotals(frame, bounties);
  frame.list.append(...bounties.sort((a, b) => livePotUsd(b) - livePotUsd(a)).map(patchBoardCardInPlace));
  return frame;
}

function patchBoardCardInPlace(bounty) {
  let card = boardCards.get(bounty.slug);
  if (!card) {
    (card = document.createElement('li')).className = 'card';
    card.innerHTML = '<b class=cat></b><h2><a class=title></a></h2><div class=money><div><small>Live pot</small><b class=pot></b></div><div><small>Entry fee</small><b class=fee></b></div><div><small>Time left</small><b class=left></b></div></div><p class=meta>';
    card.querySelector('a').href = '#/bounty/' + bounty.slug;
    boardCards.set(bounty.slug, card);
  }
  const fill = (part, text) => setText(card.querySelector('.' + part), text);
  fill('cat', bounty.category);
  fill('title', bounty.title);
  fill('pot', formatUsd(livePotUsd(bounty)));
  fill('fee', bounty.entryFeeUsd > 0 ? formatUsd(bounty.entryFeeUsd) : 'Free');
  fill('meta', describeEntriesPerPaidPlace(bounty));
  fill('left', formatTimeLeft((card.querySelector('.left').dataset.deadline = bounty.deadline)));
  return card;
}

function writeBoardTotals(frame, bounties) {
  const sum = (pick) => bounties.reduce((total, bounty) => total + pick(bounty), 0);
  const html = `<b>${bounties.length}</b> taking entries · <b>${formatUsd(Math.round(sum(livePotUsd)))}</b> in live pots · <b>${sum((b) => b.submissionCount).toLocaleString()}</b> entries`;
  if (frame.totals.innerHTML != html) frame.totals.innerHTML = html;
}

async function readBoardFirstTime() {
  const response = await fetch('https://make.fun/api/competitions?status=open&activity=times', { cache: 'no-store' });
  if (!response.ok) throw response.status;
  return { etag: response.headers.get('etag'), data: await response.json() };
}

function describeEntriesPerPaidPlace(bounty) {
  const entries = bounty.submissionCount;
  const places = Object.keys(bounty.rewards || {}).length;
  return `${entries.toLocaleString()} entries · ${places} paid places · ` + (entries > places ? `${Math.round(entries / places)} per place` : 'all can place');
}

function formatTimeLeft(deadline) {
  const s = (new Date(deadline) - Date.now()) / 1e3;
  const [d, h, m] = [s / 864e2, (s % 864e2) / 3600, (s % 3600) / 60].map(Math.floor);
  return s < 1 ? 'Closed' : d ? `${d}d ${h}h ${m}m` : `${h}h ${m}m ${Math.floor(s % 60)}s`;
}

const formatUsd = (value) => '$' + Number(value).toLocaleString('en', { minimumFractionDigits: value % 1 ? 2 : 0 });
const livePotUsd = (bounty) => +(bounty.potUsd ?? bounty.rewardAmount);
const isTakingEntries = (bounty) => new Date(bounty.deadline) > Date.now();
const setText = (node, text) => node.textContent != text && (node.textContent = text);

window.__shotReady = false;
const firstRead = location.hash.length > 2 ? null : await readBoardFirstTime().catch(() => null);
const frame = firstRead && paintBoardFirstFrame(document.querySelector('main'), firstRead.data.items.filter(isTakingEntries));
(await import('./app.js')).startApp({ firstRead, frame, paintBoardFirstFrame, writeBoardTotals, patchBoardCardInPlace, formatTimeLeft, formatUsd, livePotUsd, isTakingEntries, setText });
</script>
<style>
:root{--bg:#e9ecf1;--surface:#fff;--border:#cdd2dc;--text:#11131a;--muted:#4f5664;--accent:#5b3df5;--money:#067a3e;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f14;--surface:#171a21;--border:#323845;--text:#eef0f4;--muted:#adb4c2;--accent:#a395ff;--money:#4fd890}}
body{margin:0}
body>header{display:flex;align-items:center;gap:16px;padding:8px max(16px,50% - 620px);background:#14121f}
a{text-decoration:none}
body>header a{color:#fff;font-weight:700;font-size:1.2rem}
main{max-width:1240px;margin:auto;padding:12px 16px}
.hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:10px}
h1{margin:0}
.totals,.live{margin:0;font-size:1.1rem}
.live{margin-left:auto;color:var(--money);font-weight:700}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.card{display:grid;grid-template-rows:auto 1fr auto auto;gap:6px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.money{display:flex;justify-content:space-between;align-items:end;gap:8px}
small,.cat{font-size:.8rem;font-weight:700;text-transform:uppercase;color:var(--muted)}
.cat{color:var(--accent)}
h2{margin:0;font-size:1.15rem;text-wrap:balance}
.title{color:inherit}
.money b{display:block;font-size:1.45rem}
.money .pot{font-size:2.4rem;color:var(--money)}
.meta{margin:0;padding-top:6px;border-top:1px solid var(--border);color:var(--muted)}
@media (max-width:480px){.money{flex-wrap:wrap}.money>:first-child{flex:1 0 100%}}
</style>

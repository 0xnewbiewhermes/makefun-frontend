<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live bounties · make.fun</title>
<style>
:root{background:#f3f4f7;color:#11131a;font:16px system-ui,sans-serif}
body{margin:0}
body>header{display:flex;align-items:center;gap:16px;padding:12px max(16px,50% - 620px);background:#14121f}
body>header a{color:#fff;font-weight:700;text-decoration:none}
main{max-width:1240px;margin:auto;padding:12px 16px}
h1{margin:4px 0}
.totals{margin:0 0 12px;font-size:1.1rem;color:#555c6a}
.grid{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{position:relative;display:grid;gap:6px;padding:12px 16px;background:#fff;border:1px solid #d8dce4;border-radius:12px}
.money{display:flex;justify-content:space-between;align-items:end}
small,.cat{font-size:.8rem;font-weight:700;text-transform:uppercase;color:#555c6a}
.cat{color:#5b3df5}
h2{margin:0;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{color:inherit;text-decoration:none}
.title::after{content:"";position:absolute;inset:0}
.money b{display:block;font-size:1.35rem}
.money .pot{font-size:2.3rem;color:#067a3e}
.meta{margin:0;padding-top:6px;border-top:1px solid #d8dce4;color:#555c6a}
</style>
<header><a href="#/">make.fun · Live bounty board</a></header>
<main>Loading live bounties…</main>
<script type="module">/* First frame: readBoardFirstTime, paintBoardFirstFrame, then import(app.js) */
const boardCards = new Map();

async function readBoardFirstTime() {
  const response = await fetch('https://make.fun/api/competitions?status=open&activity=times', { cache: 'no-store' });
  if (!response.ok) throw response.status;
  return { etag: response.headers.get('etag'), data: await response.json() };
}

function paintBoardFirstFrame(container, bounties) {
  container.innerHTML = '<h1 tabindex=-1>Live bounties</h1><p class=totals></p><ul class=grid></ul>';
  const frame = { totals: container.children[1], list: container.children[2] };
  writeBoardTotals(frame, bounties);
  frame.list.append(...bounties.sort((a, b) => livePotUsd(b) - livePotUsd(a)).map(patchBoardCardInPlace));
  return frame;
}

function writeBoardTotals(frame, bounties) {
  const sum = (pick) => bounties.reduce((total, bounty) => total + pick(bounty), 0);
  setText(frame.totals, `${bounties.length} taking entries · ${formatUsd(Math.round(sum(livePotUsd)))} in live pots · ${sum((b) => b.submissionCount).toLocaleString()} entries`);
}

function patchBoardCardInPlace(bounty) {
  let card = boardCards.get(bounty.slug);
  if (!card) {
    card = document.createElement('li');
    card.className = 'card';
    card.innerHTML = '<b class=cat></b><h2><a class=title></a></h2><div class=money><div><small>Live pot</small><b class=pot></b></div><div><small>Entry fee</small><b class=fee></b></div><div><small>Time left</small><b class=left></b></div></div><p class=meta>';
    card.querySelector('a').href = '#/bounty/' + bounty.slug;
    boardCards.set(bounty.slug, card);
  }
  const fill = (part, text) => setText(card.querySelector('.' + part), text);
  fill('cat', bounty.category || 'Bounty');
  fill('title', bounty.title);
  fill('pot', formatUsd(livePotUsd(bounty)));
  fill('fee', bounty.entryFeeUsd > 0 ? formatUsd(bounty.entryFeeUsd) : 'Free');
  fill('meta', describeEntriesPerPaidPlace(bounty));
  fill('left', formatTimeLeft((card.querySelector('.left').dataset.deadline = bounty.deadline)));
  return card;
}

function describeEntriesPerPaidPlace(bounty) {
  const entries = bounty.submissionCount;
  const places = Object.keys(bounty.rewards || {}).length;
  return `${entries.toLocaleString()} entries for ${places} paid places` + (entries > places ? ` · ${Math.round(entries / places)} per place` : ' · all can place');
}

function formatTimeLeft(deadline) {
  const s = (new Date(deadline) - Date.now()) / 1000;
  const [d, h, m, sec] = [s / 86400, (s % 86400) / 3600, (s % 3600) / 60, s % 60].map(Math.floor);
  return s < 1 ? 'Closed' : d ? `${d}d ${h}h ${m}m` : `${h}h ${m}m ${sec}s`;
}

const formatUsd = (value) => '$' + Number(value).toLocaleString('en', { minimumFractionDigits: value % 1 ? 2 : 0 });
const livePotUsd = (bounty) => +(bounty.potUsd ?? bounty.rewardAmount);
const isTakingEntries = (bounty) => new Date(bounty.deadline) > Date.now();
const setText = (node, text) => node.textContent != text && (node.textContent = text);

window.__shotReady = false;
const firstRead = location.hash.length > 2 ? null : await readBoardFirstTime().catch(() => null);
const frame = firstRead && paintBoardFirstFrame(document.querySelector('main'), firstRead.data.items.filter(isTakingEntries));
(await import('./app.js')).startApp({ firstRead, frame, paintBoardFirstFrame, writeBoardTotals, patchBoardCardInPlace, formatTimeLeft, formatUsd, livePotUsd, isTakingEntries, setText });
</script>
